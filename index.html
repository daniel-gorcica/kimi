<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kimi Antonelli — GRIDO1 Racing Systems</title>
  <meta name="description"
    content="Kimi Antonelli, driver_012 of GRIDO1 Racing Systems, in his rookie Mercedes-AMG F1 season.">
  <script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/",
    "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/",
    "lenis": "https://cdn.jsdelivr.net/npm/lenis@1.3.26/dist/lenis.mjs"
  }
}
</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    /* KIMI — GRIDO1 Racing Systems. Tier 1 raw values, tier 2 roles, then blocks. */
    :root {
      --raw-color-ice-50: #f7fafb;
      --raw-color-ice-100: #ebeef1;
      --raw-color-ice-200: #dfe5e9;
      --raw-color-steel-400: #b6c1c8;
      --raw-color-ink-950: #090a0b;
      --raw-color-ink-900: #0e0f14;
      --raw-color-ink-800: #1b1d24;
      --raw-color-ink-700: #2a2d36;
      --raw-color-ink-alpha-35: rgb(9 10 11 / 0.35);
      --raw-color-slate-500: #7a7a7a;
      --raw-color-slate-600: #4d4d4d;
      --raw-color-slate-900: #1e1e1e;
      --raw-color-cyan-400: #02d2e3;
      --raw-color-cyan-alpha-25: rgb(2 210 227 / 0.25);
      --raw-color-stone-600: #535450;
      --raw-color-white-alpha-10: rgb(255 255 255 / 0.1);
      --raw-color-white-alpha-20: rgb(255 255 255 / 0.2);
      --raw-color-ink-alpha-08: rgb(9 10 11 / 0.08);
      --raw-color-white-alpha-40: rgb(255 255 255 / 0.4);
      --raw-color-white: #ffffff;
      --raw-color-orange-500: #ff6b00;

      --k-background: var(--raw-color-ice-50);
      --k-foreground: var(--raw-color-ink-950);
      --foreground-muted: var(--raw-color-ink-alpha-35);
      --surface-dark: var(--raw-color-ink-900);
      --surface-dark-raised: var(--raw-color-ink-800);
      --surface-black: var(--raw-color-ink-950);
      --surface-muted: var(--raw-color-ice-100);
      --surface-soft: var(--raw-color-ice-200);
      --foreground-on-dark: var(--raw-color-white);
      --foreground-on-dark-muted: var(--raw-color-steel-400);
      --foreground-on-dark-faint: var(--raw-color-white-alpha-40);
      --border-muted: var(--raw-color-ice-200);
      --border-on-dark: var(--raw-color-ink-700);
      --map-dot: var(--raw-color-slate-500);
      --map-grid: var(--raw-color-slate-600);
      --map-grid-ghost: var(--raw-color-slate-900);
      --map-mark: var(--raw-color-ice-50);
      --timeline-outline: var(--raw-color-stone-600);
      --timeline-fill: var(--raw-color-white-alpha-10);
      --timeline-rail: var(--raw-color-white-alpha-20);
      --paddock-contour: var(--raw-color-ink-alpha-08);
      --footer-contour: var(--raw-color-white-alpha-10);
      --k-accent: var(--raw-color-cyan-400);
      --accent-muted: var(--raw-color-cyan-alpha-25);
      --type-impact: 6rem;
      --type-display-lg: 4.375rem;
      --type-display: 3.25rem;
      --type-heading: 2.375rem;
      --type-title: 1.25rem;
      --type-lead: 1.125rem;
      --type-label: 1rem;
      --type-body: 0.875rem;
      --type-eyebrow: 0.75rem;
      --type-display-sm: 3.4375rem;
      --type-year: 2.25rem;
      --ease-entrance: cubic-bezier(0.2, 0, 0, 1);
      --ease-plate: cubic-bezier(0.33, 0, 0, 1);
      --font-sans: "Space Grotesk", system-ui, sans-serif;
      --font-display: "Oswald", Impact, sans-serif;
    }

    html {
      font-size: 16px;
    }

    @media (max-width: 1920px) {
      html {
        font-size: 0.833333vw;
      }
    }

    @media (max-width: 1440px) {
      html {
        font-size: 1.111111vw;
      }
    }

    @media (max-width: 1279px) {
      html {
        font-size: 16px;
      }
    }

    @media (min-width: 1441px) and (max-width: 1920px) {
      [data-hero] {
        --hero-base: calc(1920 / 1440);
        --type-impact: calc(6rem * var(--hero-base));
        --type-display-lg: calc(4.375rem * var(--hero-base));
        --type-display: calc(3.25rem * var(--hero-base));
        --type-heading: calc(2.375rem * var(--hero-base));
        --type-title: calc(1.25rem * var(--hero-base));
        --type-lead: calc(1.125rem * var(--hero-base));
        --type-label: calc(1rem * var(--hero-base));
        --type-body: calc(0.875rem * var(--hero-base));
        --type-eyebrow: calc(0.75rem * var(--hero-base));
      }

      [data-hero] [data-hero-panels] {
        width: calc(13.625rem * var(--hero-base, 1));
      }

      [data-hero] [data-hero-stats] {
        width: calc(10.75rem * var(--hero-base, 1));
      }

      [data-hero] [data-hero-map] {
        height: calc(3.125rem * var(--hero-base, 1));
        width: calc(4.875rem * var(--hero-base, 1));
      }

      [data-season] {
        --season-base: calc(1920 / 1440);
        --type-display-sm: calc(3.4375rem * var(--season-base));
        --type-lead: calc(1.125rem * var(--season-base));
        --type-body: calc(0.875rem * var(--season-base));
        --type-eyebrow: calc(0.75rem * var(--season-base));
      }
    }

    body.k-body {
      background: var(--k-background);
      color: var(--k-foreground);
      min-height: 100lvh;
      margin: 0;
      font-family: var(--font-sans);
    }

    .kimi {
      font-family: var(--font-sans);
      color: var(--k-foreground);
      background: var(--k-background);
    }

    :where(.kimi) a {
      color: inherit;
      text-decoration: none;
    }

    :where(.kimi) ul,
    :where(.kimi) ol {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    :where(.kimi) :is(p, h1, h2, dl, dd, dt) {
      margin: 0;
    }

    :where(.kimi) img {
      display: block;
      max-width: none;
    }

    .k-sr {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    .k-split {
      display: flex;
      flex-wrap: wrap;
      column-gap: 0.3em;
    }

    .k-unit {
      display: inline-block;
      opacity: 0;
      will-change: transform, opacity;
    }

    .k-letters {
      flex-wrap: nowrap;
    }

    .k-word {
      display: inline-flex;
      white-space: nowrap;
    }

    [data-rise],
    [data-meta],
    [data-hero-panels],
    .actions {
      opacity: 0;
    }

    .k-arrow {
      width: 0.65em;
      height: 0.5em;
      transition: transform 150ms var(--ease-entrance);
    }

    #k-fail {
      position: fixed;
      left: 0;
      right: 0;
      top: 0;
      z-index: 9999;
      background: var(--raw-color-orange-500);
      color: var(--raw-color-white);
      font: 500 14px/1.3 var(--font-sans);
      padding: 10px 16px;
    }

    /* ---------------- The sticky stack ---------------- */
    .stack {
      position: relative;
      background: var(--surface-black);
    }

    .stack-pin {
      position: sticky;
      top: 0;
    }

    .stack-last {
      position: relative;
      z-index: 20;
    }

    .stack-inner {
      transform-origin: center;
    }

    .stack-shade {
      position: absolute;
      inset: 0;
      background: var(--surface-black);
      opacity: 0;
      pointer-events: none;
    }

    /* ---------------- 1 — Hero ---------------- */
    .hero {
      position: relative;
      isolation: isolate;
      min-height: 100lvh;
      overflow: hidden;
      background: var(--k-background);
    }

    .hero-canvas {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      transform: translateZ(0);
      backface-visibility: hidden;
      will-change: transform;
    }

    .hero-canvas canvas,
    .hero-canvas img.hero-fallback {
      width: 100%;
      height: 100%;
      display: block;
    }

    .hero-canvas .hero-fallback-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hero-canvas .hero-fallback-person {
      position: absolute;
      left: 50%;
      bottom: 0;
      height: 100%;
      width: auto;
      transform: translateX(-50%);
    }

    .hero-figure {
      display: none;
      position: absolute;
      inset: 0;
      margin: 0 -1.5rem;
      pointer-events: none;
    }

    .hero-fit {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: calc(100% - 4rem);
    }

    .hero-figure-ramp {
      display: none;
    }

    .hero-ramp {
      display: none;
    }

    @media (max-width: 1279.98px) {
      .hero-figure {
        display: block;
      }

      .hero-ramp {
        display: block;
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 22%;
        z-index: 10;
        pointer-events: none;
        background-image: linear-gradient(to bottom,
            color-mix(in srgb, var(--k-background) 0%, transparent) 0%,
            color-mix(in srgb, var(--k-background) 6%, transparent) 26%,
            color-mix(in srgb, var(--k-background) 20%, transparent) 46%,
            color-mix(in srgb, var(--k-background) 45%, transparent) 64%,
            color-mix(in srgb, var(--k-background) 74%, transparent) 80%,
            color-mix(in srgb, var(--k-background) 93%, transparent) 91%,
            var(--k-background) 100%);
      }
    }

    @media (min-width: 768px) and (max-width: 1279.98px) {
      .hero-fit {
        height: calc(100% - 2rem);
      }
    }

    @media (max-width: 1023.98px) {
      .hero-figure {
        top: auto;
        height: 70%;
      }

      .hero-fit {
        height: 100%;
      }
    }

    @media (max-width: 767.98px) {
      .hero-figure-ramp {
        display: block;
        position: absolute;
        left: 0;
        right: 0;
        bottom: -13rem;
        height: 26rem;
        z-index: 10;
        background: linear-gradient(to bottom, transparent, var(--k-background) 60%, var(--k-background));
      }
    }

    @media (max-width: 639.98px) {
      .hero-figure {
        height: 64%;
      }
    }

    .hero-content {
      position: relative;
      z-index: 20;
      min-height: 100lvh;
      display: flex;
      flex-direction: column;
      padding: 1.5rem;
      box-sizing: border-box;
      gap: 2rem;
    }

    @media (min-width: 640px) {
      .hero-content {
        padding-left: 2rem;
        padding-right: 2rem;
      }
    }

    @media (max-height: 500px) {
      .hero-content {
        padding-top: 0.75rem;
        padding-bottom: 0.75rem;
        gap: 1rem;
      }
    }

    @media (min-width: 1280px) {
      .hero-content {
        gap: 0;
      }
    }

    @media (max-width: 1023.98px) {
      .hero-content {
        gap: 1rem;
      }
    }

    @media (max-width: 639.98px) {
      .hero-content {
        gap: 0.5rem;
      }
    }

    .masthead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 30;
    }

    .masthead-logo img {
      height: 1.5rem;
      width: auto;
    }

    .masthead-nav {
      display: none;
    }

    .masthead-nav ul {
      display: flex;
      gap: 4rem;
    }

    .masthead-nav a,
    .masthead-garage {
      font-size: var(--type-label);
      text-transform: uppercase;
      line-height: 0.9;
      color: var(--k-foreground);
      transition: color 150ms var(--ease-entrance);
    }

    .masthead-nav a:hover,
    .masthead-garage:hover {
      color: var(--k-accent);
    }

    .masthead-garage {
      display: none;
      font-weight: 700;
    }

    .burger {
      display: flex;
      flex-direction: column;
      gap: 0.3125rem;
      padding: 0.5rem;
      margin-right: -0.5rem;
      background: none;
      border: 0;
      cursor: pointer;
    }

    .burger span,
    .sheet-close span {
      display: block;
      width: 1.5rem;
      height: 1px;
      background: var(--k-foreground);
    }

    @media (min-width: 1280px) {
      .masthead-nav {
        display: block;
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
      }

      .masthead-garage {
        display: inline;
      }

      .burger {
        display: none;
      }
    }

    .hero-middle {
      display: flex;
      flex-direction: column;
      gap: inherit;
    }

    @media (min-width: 768px) {
      .hero-middle {
        flex-direction: row;
        justify-content: space-between;
        gap: 2rem;
        align-items: flex-start;
      }
    }

    @media (min-width: 1280px) {
      .hero-middle {
        flex: 1;
        align-items: center;
      }
    }

    .identity {
      display: flex;
      flex-direction: column;
    }

    @media (min-width: 1280px) {
      .identity {
        max-width: 26.0625rem;
        gap: 6.0625rem;
      }
    }

    .identity-name {
      position: relative;
    }

    .driver-id {
      font-size: var(--type-label);
      text-transform: uppercase;
      color: var(--foreground-muted);
      margin-bottom: 1rem;
      opacity: 0;
      line-height: 0.9;
    }

    @media (max-height: 500px) {
      .driver-id {
        margin-bottom: 0.25rem;
      }
    }

    @media (min-width: 1280px) {
      .driver-id {
        position: absolute;
        left: 20.0625rem;
        top: 0.5625rem;
        margin: 0;
      }
    }

    .hero-name {
      font-family: var(--font-display);
      font-weight: 700;
      text-transform: uppercase;
      line-height: 0.95;
      max-width: 6em;
      justify-content: flex-start;
      text-align: left;
      font-size: var(--type-display-lg);
    }

    @media (max-height: 500px) {
      .hero-name {
        font-size: var(--type-heading);
      }
    }

    @media (min-width: 768px) {
      .hero-name {
        font-size: var(--type-impact);
      }
    }

    @media (min-width: 1024px) {
      .hero-name {
        font-size: var(--type-display-lg);
      }
    }

    @media (min-width: 1280px) {
      .hero-name {
        font-size: var(--type-impact);
      }
    }

    .meta {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-top: 1.5rem;
    }

    @media (min-width: 1280px) {
      .meta {
        margin-top: 0;
      }
    }

    @media (max-height: 500px) {
      .meta {
        gap: 0.25rem;
        margin-top: 0.5rem;
      }
    }

    .meta li {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: var(--type-lead);
      text-transform: uppercase;
      line-height: 0.9;
    }

    .meta-flag {
      width: 1.125rem;
      height: 0.75rem;
    }

    .meta-rookie {
      width: 1rem;
      height: 1rem;
    }

    .meta-merc {
      width: 0.875rem;
      height: 0.875rem;
    }

    .panels {
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
    }

    @media (max-width: 639.98px) {
      .panels {
        display: none;
      }
    }

    @media (min-width: 768px) {
      .panels {
        flex-direction: column;
        flex-wrap: nowrap;
        width: 13.625rem;
      }
    }

    .bpanel {
      position: relative;
      padding: 1rem;
      color: var(--k-foreground);
    }

    @media (min-width: 640px) {
      .bpanel {
        padding: 1rem 1.375rem 1.1875rem;
      }
    }

    .k-corner {
      position: absolute;
      width: 0.625rem;
      height: 0.625rem;
      display: block;
    }

    .k-corner svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .k-tr {
      top: 0;
      right: 0;
    }

    .k-tl {
      top: 0;
      left: 0;
      transform: scaleX(-1);
    }

    .k-bl {
      bottom: 0;
      left: 0;
      transform: scale(-1);
    }

    .k-br {
      bottom: 0;
      right: 0;
      transform: scaleY(-1);
    }

    .eyebrow {
      font-size: var(--type-eyebrow);
      font-weight: 500;
      text-transform: uppercase;
      line-height: 0.9;
      letter-spacing: -0.02em;
      color: var(--k-accent);
    }

    .race-row {
      display: flex;
      justify-content: space-between;
    }

    @media (min-width: 768px) {
      .race-row {
        display: block;
      }
    }

    .race-list {
      display: flex;
      flex-direction: column;
      gap: 0.375rem;
      margin-top: 1rem;
      font-size: var(--type-body);
      text-transform: uppercase;
      line-height: 0.9;
    }

    .race-list dt {
      font-weight: 700;
    }

    .race-map {
      width: 6.25rem;
      height: 4.375rem;
      object-fit: contain;
      object-position: right;
    }

    @media (min-width: 640px) {
      .race-map {
        width: 4.875rem;
        height: 3.125rem;
        object-position: left;
      }
    }

    @media (min-width: 768px) {
      .race-map {
        margin-top: 1.75rem;
      }
    }

    .hero-stats {
      margin-top: 1.5rem;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
    }

    @media (min-width: 640px) {
      .hero-stats {
        display: flex;
        width: 10.75rem;
        justify-content: space-between;
      }

      .hero-stats>div {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
    }

    .hero-stats dt {
      font-size: var(--type-eyebrow);
      text-transform: uppercase;
      letter-spacing: -0.04em;
      white-space: nowrap;
      line-height: 0.9;
    }

    .hero-stats dd {
      font-family: var(--font-display);
      font-weight: 500;
      font-size: var(--type-heading);
      line-height: 0.72;
      letter-spacing: -0.08em;
      margin-top: 0.5rem;
    }

    .actions {
      margin-top: 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    @media (min-width: 640px) {
      .actions {
        margin-top: 0;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: end;
        gap: 2rem;
      }
    }

    @media (max-width: 1279.98px) {
      .actions {
        margin-top: auto;
      }
    }

    .trailer {
      display: none;
      align-items: center;
      gap: 0.75rem;
    }

    .trailer img {
      width: 2rem;
      height: 2rem;
    }

    .trailer>span {
      display: flex;
      flex-direction: column;
      gap: 0.375rem;
      font-size: var(--type-body);
      text-transform: uppercase;
      line-height: 0.9;
    }

    .trailer-label {
      font-weight: 500;
      transition: color 150ms var(--ease-entrance);
    }

    .trailer:hover .trailer-label {
      color: var(--k-accent);
    }

    .trailer-time {
      color: var(--foreground-muted);
    }

    @media (min-width: 640px) {
      .trailer {
        display: flex;
      }
    }

    .cta-profile {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--type-title);
      height: 3.5rem;
      width: 100%;
    }

    @media (min-width: 640px) {
      .cta-profile {
        height: 2.5em;
        width: 11em;
      }
    }

    .cta-profile>svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .cta-flood {
      fill: var(--k-accent);
      transform-origin: left;
      transform: scaleX(0);
      transition: transform 250ms var(--ease-plate);
      transform-box: fill-box;
    }

    .cta-ring {
      stroke: var(--k-accent);
      stroke-opacity: 0.25;
    }

    .cta-brackets {
      stroke: var(--k-accent);
    }

    .cta-label {
      position: relative;
      display: flex;
      align-items: center;
      gap: 1.6em;
      text-transform: uppercase;
      line-height: 0.9;
      color: var(--k-accent);
      transition: color 250ms var(--ease-plate);
    }

    .cta-profile:hover .cta-flood {
      transform: scaleX(1);
    }

    .cta-profile:hover .cta-label {
      color: var(--surface-black);
    }

    .cta-profile:hover .k-arrow {
      transform: translateX(0.25rem);
    }

    .socials {
      display: none;
      justify-content: flex-end;
      gap: 2rem;
      font-size: var(--type-body);
      text-transform: uppercase;
      line-height: 0.9;
    }

    .socials a {
      transition: color 150ms var(--ease-entrance);
    }

    .socials a:hover {
      color: var(--k-accent);
    }

    @media (min-width: 640px) {
      .socials {
        display: flex;
      }
    }

    @media (min-width: 1280px) {
      .socials {
        gap: 3.6875rem;
      }
    }

    /* The veil */
    .veil {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--k-background);
      pointer-events: auto;
    }

    .veil-content {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .veil-helmet {
      position: relative;
      width: 7.2rem;
      height: 8.5rem;
      mask-size: contain;
      mask-repeat: no-repeat;
      mask-position: center;
      -webkit-mask-size: contain;
      -webkit-mask-repeat: no-repeat;
      -webkit-mask-position: center;
    }

    .veil-shell {
      position: absolute;
      inset: 0;
      background: var(--k-foreground);
      opacity: 0.12;
    }

    .veil-fill {
      position: absolute;
      inset: 0;
      background: var(--k-foreground);
      transform-origin: top;
      transform: scaleY(0);
    }

    .veil-name {
      margin-top: 1.75rem;
      font-size: var(--type-lead);
      text-transform: uppercase;
      line-height: 0.9;
      letter-spacing: 0.18em;
      opacity: 0;
    }

    .veil-meter {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 4px;
      background: var(--border-muted);
    }

    .veil-meter-fill {
      position: absolute;
      inset: 0;
      background: var(--k-foreground);
      transform-origin: left;
      transform: scaleX(0);
    }

    /* The menu sheet */
    .sheet {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: var(--k-background);
      padding: 1.5rem 2rem;
      display: flex;
      flex-direction: column;
      font-family: var(--font-sans);
      color: var(--k-foreground);
      opacity: 0;
    }

    .sheet a {
      color: inherit;
      text-decoration: none;
    }

    .sheet-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sheet-top img {
      height: 1.5rem;
      width: auto;
    }

    .sheet-close {
      position: relative;
      width: 2.5rem;
      height: 2.5rem;
      margin-right: -0.5rem;
      background: none;
      border: 0;
      cursor: pointer;
    }

    .sheet-close span {
      position: absolute;
      left: 0.5rem;
      top: 50%;
    }

    .sheet-close span:first-child {
      transform: rotate(45deg);
    }

    .sheet-close span:last-child {
      transform: rotate(-45deg);
    }

    .sheet nav {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1rem;
    }

    .sheet nav a {
      display: block;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: var(--type-heading);
      text-transform: uppercase;
      line-height: 0.95;
      transition: color 150ms var(--ease-entrance);
      opacity: 0;
    }

    .sheet nav a:hover {
      color: var(--k-accent);
    }

    @media (min-width: 640px) {
      .sheet nav {
        gap: 1.5rem;
      }

      .sheet nav a {
        font-size: var(--type-display);
      }
    }

    html.k-locked {
      position: relative;
      overflow: hidden;
      height: 100%;
    }

    /* ---------------- Head lines shared by four blocks ---------------- */
    .head-line {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
    }

    .head-line .k-split {
      display: inline-flex;
    }

    .head-stop {
      display: inline-block;
      opacity: 0;
    }

    /* ---------------- Chequered dissolve ---------------- */
    .chequer {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      width: 100%;
      height: 34svh;
      pointer-events: none;
      display: block;
    }

    .chequer-season {
      z-index: 10;
    }

    .chequer-timeline,
    .chequer-paddock {
      z-index: 30;
    }

    @media (max-width: 639.98px) {
      .chequer {
        z-index: 0 !important;
      }
    }

    /* ---------------- 2 — The season so far ---------------- */
    .season {
      container-type: inline-size;
      position: relative;
      isolation: isolate;
      min-height: var(--season-h, 100lvh);
      overflow: hidden;
      background: var(--surface-black);
      color: var(--foreground-on-dark);
    }

    @media (max-width: 1023.98px) {
      .season {
        --gutter-min: 32px;
        --type-min: 13px;
        --copy-min-size: 17px;
        --copy-min-w: 15rem;
        --head-min: 6.6667cqw;
        --plate-w: 277px;
        --plate-h: 78px;
        --plate-cell: 83px;
        --plate-badge-gap: 11px;
        --plate-globe-w: 37px;
        --plate-globe-h: 23px;
        --plate-stats-left: 16px;
        --plate-stats-gap: 8px;
        --plate-eyebrow: 12px;
        --plate-body: 14px;
      }
    }

    @media (max-width: 639.98px) {
      .season {
        --head-min: 40px;
        --head-air: 20px;
        --season-h: 680px;
      }
    }

    .season-frame {
      position: absolute;
      inset: 0;
      overflow: hidden;
      mask-image: linear-gradient(to bottom, transparent 0, #000 10%, #000 90%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 10%, #000 90%, transparent 100%);
    }

    @media (max-width: 1023.98px) {
      .season-frame {
        mask-image: none;
        -webkit-mask-image: none;
      }
    }

    .season-stage {
      position: absolute;
      left: 0;
      top: 0;
      width: 1440px;
      height: 800px;
      transform-origin: top left;
    }

    .season-map {
      position: absolute;
      left: 0;
      top: -4.559px;
      width: 1438.43px;
      height: 809.11px;
    }

    .season-dots,
    .season-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .season-trace {
      position: absolute;
      left: 0;
      top: 0;
      width: 1440px;
      height: 800px;
    }

    .season-copy {
      position: relative;
      z-index: 20;
      min-height: var(--season-h, 100lvh);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 4rem;
      padding: 4.8611cqw 1.5rem 2rem;
      box-sizing: border-box;
      --season-gutter: max(2.2222cqw, var(--gutter-min, 0px));
    }

    @media (min-width: 640px) {
      .season-copy {
        padding: 4.8611cqw var(--season-gutter) var(--season-gutter);
      }
    }

    .season-head {
      font-family: var(--font-display);
      font-weight: 700;
      text-transform: uppercase;
      line-height: 0.95;
      color: var(--k-accent);
      font-size: max(3.8194cqw, var(--head-min, 0px));
      display: flex;
      flex-direction: column;
    }

    .season-head .head-stop,
    .tl-head .head-stop,
    .ft-head .head-stop {
      color: var(--foreground-on-dark);
    }

    .season-rule {
      width: 1.6667cqw;
      height: 0.1389cqw;
      min-height: 2px;
      background: var(--k-accent);
      margin-top: max(1.9444cqw, var(--head-air, 0px));
      transform-origin: left;
      opacity: 0;
    }

    .season-intro {
      text-transform: uppercase;
      line-height: 1.1;
      margin-top: max(2.0833cqw, var(--head-air, 0px));
      width: max(16.1111cqw, var(--copy-min-w, 0px));
      font-size: max(1.25cqw, var(--copy-min-size, 0px));
    }

    .standings {
      align-self: flex-end;
      position: relative;
      width: var(--plate-w, 19.2361cqw);
      height: var(--plate-h, 5.4167cqw);
      display: grid;
      grid-template-columns: var(--plate-cell, 5.7639cqw) 1fr;
      opacity: 0;
    }

    .standings-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .standings-frame path {
      fill: var(--surface-black);
      stroke: var(--k-accent);
      stroke-width: 1;
    }

    .standings-frame line {
      stroke: var(--k-accent);
      stroke-width: 1;
    }

    .standings-badge {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--plate-badge-gap, 0.7639cqw);
    }

    .globe {
      width: var(--plate-globe-w, 2.5694cqw);
      height: var(--plate-globe-h, 1.5972cqw);
      overflow: visible;
      fill: none;
      stroke: var(--k-accent);
      stroke-width: 1;
    }

    .globe * {
      vector-effect: non-scaling-stroke;
    }

    .badge-word {
      display: flex;
      gap: 0.3em;
      font-size: var(--plate-eyebrow, max(0.8333cqw, var(--type-min, 0px)));
      line-height: 0.72;
      letter-spacing: -0.02em;
      text-transform: uppercase;
    }

    .badge-year {
      color: var(--k-accent);
    }

    .standings-stats {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-left: var(--plate-stats-left, 1.1111cqw);
      gap: var(--plate-stats-gap, 0.5556cqw);
      text-transform: uppercase;
      line-height: 0.72;
      font-size: var(--plate-body, max(0.9722cqw, var(--type-min, 0px)));
    }

    .standings-stats>div {
      display: flex;
      gap: 0.35em;
      white-space: nowrap;
    }

    .standings-stats dt {
      color: var(--k-accent);
    }

    .standings-stats dd {
      flex: 1;
      color: var(--foreground-on-dark);
    }

    /* ---------------- 3 — Timeline ---------------- */
    .timeline {
      container-type: inline-size;
      position: relative;
      isolation: isolate;
      width: 100%;
      background: var(--surface-black);
      color: var(--foreground-on-dark);
      --gutter: max(2.2222cqw, var(--gutter-min, 0px));
      --bottom-pad: 10.4167cqw;
      --bottom-pad-narrow: 5cqw;
      --top-pad: 11.7361cqw;
      --rail-top: 0px;
      padding-bottom: var(--bottom-pad);
    }

    @media (max-width: 1023.98px) {
      .timeline {
        overflow-x: clip;
        --copy-min-size: 17px;
        --head-min: 6.6667cqw;
        --head-w-min: 82cqw;
        --year-min: 30px;
        --copy-min-w: 200px;
        --rail-top: calc(11.7361cqw + var(--top-pad-extra, 0px));
      }
    }

    @media (min-width: 640px) and (max-width: 1023.98px) {
      .timeline {
        --top-pad-extra: 16cqw;
        --head-top: var(--bottom-pad);
      }
    }

    @media (max-width: 639.98px) {
      .timeline {
        --head-min: 40px;
        --top-pad-extra: 15cqw;
        --copy-min-w: 320px;
        --gutter-min: 24px;
        padding-bottom: 4rem;
      }
    }

    @media (min-width: 640px) {
      .timeline {
        --copy-max-w: 26.9444cqw;
      }
    }

    .tl-wrap {
      position: relative;
      width: 100%;
      padding-top: calc(var(--top-pad) + var(--top-pad-extra, 0px));
    }

    .tl-head {
      font-family: var(--font-display);
      font-weight: 700;
      text-transform: uppercase;
      line-height: 0.95;
      color: var(--k-accent);
      font-size: max(3.8194cqw, var(--head-min, 0px));
      position: absolute;
      z-index: 20;
      top: var(--head-top, var(--gutter));
      right: var(--gutter);
      width: max(20.3472cqw, var(--head-w-min, 0px));
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      text-align: right;
    }

    .tl-head .head-line {
      justify-content: flex-end;
    }

    @media (max-width: 1023.98px) {
      .tl-head {
        align-items: center;
        text-align: center;
        right: 50%;
        transform: translateX(50%);
        flex-direction: row;
        justify-content: center;
        gap: 0.28em;
      }

      .tl-head .head-line {
        justify-content: center;
      }
    }

    @media (max-width: 639.98px) {
      .tl-head {
        position: relative;
        top: 0;
        right: auto;
        left: 0;
        transform: none;
        justify-content: flex-start;
        width: auto;
      }
    }

    .tl-rail {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      width: 1.1111cqw;
      top: var(--rail-top);
    }

    .tl-rail svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    @media (max-width: 639.98px) {
      .tl-rail {
        display: none;
      }
    }

    .tl-row {
      position: relative;
      width: 100%;
      height: var(--row-h);
      transition: opacity 700ms var(--ease-plate);
    }

    .timeline.is-dim .tl-row:not(.is-hover) {
      opacity: 0.3;
    }

    .tl-layer {
      position: absolute;
      left: 0;
      right: 0;
      height: 100%;
      top: 0;
      pointer-events: none;
    }

    .tl-plate-layer {
      pointer-events: auto;
    }

    .tl-plate {
      position: absolute;
      top: 0;
      bottom: 0;
      width: var(--plate-w);
      pointer-events: auto;
    }

    .tl-centre .tl-plate {
      left: 50%;
      transform: translateX(-50%);
    }

    .tl-left .tl-plate {
      left: var(--gutter);
    }

    .tl-right .tl-plate {
      right: var(--gutter);
    }

    .tl-fill {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: var(--timeline-fill);
      clip-path: url(#k-plate-clip);
      transition: inset 700ms var(--ease-plate);
    }

    @media (hover: hover) {
      .tl-plate:hover .tl-fill {
        inset: 5%;
      }
    }

    .tl-slot {
      position: absolute;
      left: 0;
      right: 0;
      top: -10%;
      height: 100%;
    }

    .tl-slot img {
      width: 100%;
      height: 110%;
      object-fit: cover;
      object-position: top;
    }

    .tl-outline {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .tl-outline path {
      fill: none;
      stroke: var(--timeline-outline);
      stroke-width: 1;
    }

    .tl-year {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 20;
      pointer-events: none;
      font-family: var(--font-display);
      font-weight: 700;
      text-transform: uppercase;
      line-height: 0.95;
      color: var(--k-accent);
      font-size: max(2.5cqw, var(--year-min, 0px));
    }

    .tl-copy-layer {
      z-index: 20;
    }

    .tl-copy {
      position: absolute;
      left: 70.8333cqw;
      top: 50%;
      transform: translateY(-50%);
      z-index: 20;
      pointer-events: none;
      text-transform: uppercase;
      line-height: 1.1;
      color: var(--foreground-on-dark);
      width: min(max(var(--copy-w), var(--copy-min-w, 0px)), var(--copy-max-w, 100vw));
      font-size: max(1.25cqw, var(--copy-min-size, 0px));
      opacity: 0;
    }

    .tl-copy strong {
      font-weight: 700;
    }

    @media (max-width: 639.98px) {
      .tl-wrap {
        display: flex;
        flex-direction: column;
        gap: 2.5rem;
        padding: calc(var(--top-pad) + var(--top-pad-extra, 0px)) var(--gutter) 0;
        box-sizing: border-box;
      }

      .tl-row {
        height: auto;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .tl-layer {
        position: relative;
        height: auto;
        top: 0 !important;
      }

      .tl-plate {
        position: relative;
        width: 82%;
        aspect-ratio: 710 / 462;
        left: auto !important;
        right: auto !important;
        transform: none !important;
      }

      .tl-even .tl-plate {
        margin-right: auto;
      }

      .tl-odd .tl-plate {
        margin-left: auto;
      }

      .tl-year-layer {
        order: 1;
        height: 0;
      }

      .tl-year {
        position: relative;
        width: 82%;
        top: -28.8cqw;
        left: 0;
        transform: translateY(-50%);
        text-align: center;
        justify-content: center;
      }

      .tl-odd .tl-year {
        margin-left: auto;
      }

      .tl-copy-layer {
        order: 2;
      }

      .tl-copy {
        position: relative;
        left: 0;
        top: 0;
        transform: none;
        width: 100%;
      }
    }

    /* ---------------- 4 — Paddock ---------------- */
    .paddock {
      container-type: inline-size;
      position: relative;
      isolation: isolate;
      min-height: var(--block-h, 100lvh);
      width: 100%;
      overflow: hidden;
      background: var(--k-background);
      color: var(--k-foreground);
      --u: var(--panel-u, calc(100cqw / 1440));
      --band-h: calc(11.7361cqw * var(--band-scale, 1));
    }

    @media (min-width: 640px) and (max-width: 1023.98px) {
      .paddock {
        --type-min: 13px;
        --copy-min-size: 17px;
        --fig-cap: 118.75cqw;
        --fig-x-override: 65.7%;
        --cta-h: 50px;
        --band-scale: 1.75;
        --cal-spread: 1.75;
        --cal-mark-drop: 8cqw;
        --cal-card-drop: 1.3cqw;
        --panel-u: 1px;
        --intro-min-w: 280px;
      }
    }

    @media (max-width: 639.98px) {
      .paddock {
        --block-h: 1062px;
        --intro-bottom: 139px;
        --head-left: 24px;
        --intro-left: 24px;
        --head-top: 24px;
        --intro-min-w: 320px;
        --intro-gap: 24px;
        --band-fade: 60px;
        --cta-h: 50px;
        --panel-u: 1px;
        --fig-cap: 599px;
        --fig-x-override: 48.5%;
        --fig-lift: 328px;
        --band-scale: 8.48;
        --head-min: 40px;
        --type-min: 13px;
        --copy-min-size: 17px;
      }
    }

    .contours {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: block;
    }

    .pd-band {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: var(--band-h);
      background: var(--surface-black);
    }

    .pd-figure-layer {
      position: absolute;
      inset: 0;
      z-index: 10;
    }

    .pd-portrait {
      position: absolute;
      bottom: var(--fig-lift, 0px);
      left: var(--fig-x-override, 65.6917%);
      transform: translateX(-50%);
      height: min(calc(102.0363% * var(--fig-fit, 1)), var(--fig-cap, 100000px));
      width: auto;
      aspect-ratio: 1.15881;
      object-fit: cover;
      user-select: none;
    }

    .pd-melt {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 10;
      height: var(--band-h);
      background: linear-gradient(to bottom, rgb(9 10 11 / 0) 0%, var(--surface-black) var(--band-fade, 38.685%));
    }

    .pd-head {
      position: absolute;
      z-index: 20;
      left: var(--head-left, 2.2222cqw);
      top: var(--head-top, 2.2222cqw);
      font-family: var(--font-display);
      font-weight: 700;
      text-transform: uppercase;
      line-height: 0.95;
      color: var(--k-foreground);
      font-size: max(max(6.6667cqw, var(--type-min, 0px)), var(--head-min, 0px));
      display: flex;
      flex-direction: column;
    }

    .pd-head .head-stop {
      color: var(--k-accent);
    }

    .pd-intro {
      position: absolute;
      z-index: 20;
      left: var(--intro-left, 2.2222cqw);
      bottom: var(--intro-bottom, calc(var(--band-h) + 2.2222cqw));
      width: max(23.4722cqw, var(--intro-min-w, 0px));
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: var(--intro-gap, 2.7778cqw);
    }

    .pd-report {
      text-transform: uppercase;
      line-height: 1.1;
      font-size: max(1.25cqw, var(--copy-min-size, 0px));
    }

    @media (max-width: 639.98px) {
      .pd-report {
        color: var(--foreground-on-dark);
      }
    }

    .k-chamfer {
      --h: var(--cta-h, 3.4722cqw);
      position: relative;
      display: block;
      height: var(--h);
      width: calc(var(--h) * 4.34);
      opacity: 0;
    }

    .k-chamfer>svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .ch-body {
      fill: var(--surface-black);
      stroke: var(--k-accent);
      stroke-width: 1;
    }

    .ch-ring {
      fill: none;
      stroke: var(--k-accent);
      stroke-width: 1;
    }

    .ch-flood {
      fill: var(--k-accent);
      transform-origin: left;

        }
      };
      const stop = scrub(canvas, "top bottom", "top top", () => { }, (p) => {
        progress = p;
        render();
      });
      const onResize = () => render();
      window.addEventListener("resize", onResize);
      render();
      return () => {
        stop();
        window.removeEventListener("resize", onResize);
      };
    };

    // src/kimi/contours.ts
    init_engine();
    var LINE_SCALE = 3.8;
    var LINE_COUNT = 2.5;
    var WAVE_AMOUNT = 0.37;
    var WAVE_SPEED = 1.66;
    var LINE_OPACITY = 0.85;
    var CELLS = 96;
    var field = (x, y, t) => {
      let f = Math.sin(x * 1 + t * 0.6) * 0.5;
      f += Math.sin(y * 0.85 - t * 0.45) * 0.45;
      f += Math.sin((x + y) * 0.65 + t * 0.35) * 0.35;
      f += Math.sin((x - y) * 0.95 - t * 0.55) * 0.25;
      return f * 0.5 + 0.5;
    };
    var mountContours = (canvas) => {
      const start = performance.now();
      const colour = readColor(canvas.dataset.contour || "--paddock-contour");
      const draw = () => {
        const width = canvas.clientWidth;
        const height = canvas.clientHeight;
        if (!width || !height)
          return;
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        const W = Math.round(width * ratio), H = Math.round(height * ratio);
        if (canvas.width !== W || canvas.height !== H) {
          canvas.width = W;
          canvas.height = H;
        }
        const context = canvas.getContext("2d");
        if (!context)
          return;
        context.setTransform(ratio, 0, 0, ratio, 0, 0);
        context.clearRect(0, 0, width, height);
        const t = (performance.now() - start) / 1000 * WAVE_SPEED;
        const cols = width >= height ? CELLS : Math.max(8, Math.round(CELLS * width / height));
        const rows = Math.max(8, Math.round(cols * height / width));
        const stepX = width / cols, stepY = height / rows, aspect = width / height;
        const values = new Float32Array((cols + 1) * (rows + 1));
        for (let j = 0; j <= rows; j += 1)
          for (let i = 0; i <= cols; i += 1) {
            const nx = (i / cols * 2 - 1) * aspect * LINE_SCALE;
            const ny = (j / rows * 2 - 1) * LINE_SCALE;
            const qx = nx + Math.sin(ny * 0.8 + t * 0.7) * WAVE_AMOUNT;
            const qy = ny + Math.cos(nx * 0.7 - t * 0.6) * WAVE_AMOUNT;
            values[j * (cols + 1) + i] = field(qx, qy, t) * LINE_COUNT;
          }
        context.strokeStyle = colour;
        context.lineWidth = 1;
        context.globalAlpha = LINE_OPACITY;
        context.beginPath();
        for (let level = 0.5; level < LINE_COUNT; level += 1)
          for (let j = 0; j < rows; j += 1)
            for (let i = 0; i < cols; i += 1) {
              const a = values[j * (cols + 1) + i], b = values[j * (cols + 1) + i + 1];
              const c = values[(j + 1) * (cols + 1) + i + 1], d = values[(j + 1) * (cols + 1) + i];
              const index = (a > level ? 8 : 0) | (b > level ? 4 : 0) | (c > level ? 2 : 0) | (d > level ? 1 : 0);
              if (index === 0 || index === 15)
                continue;
              const x0 = i * stepX, y0 = j * stepY;
              const top = [x0 + stepX * ((level - a) / (b - a)), y0];
              const right = [x0 + stepX, y0 + stepY * ((level - b) / (c - b))];
              const bottom = [x0 + stepX * ((level - d) / (c - d)), y0 + stepY];
              const left = [x0, y0 + stepY * ((level - a) / (d - a))];
              const segment = (p, q) => {
                context.moveTo(p[0], p[1]);
                context.lineTo(q[0], q[1]);
              };
              switch (index) {
                case 1:
                case 14:
                  segment(left, bottom);
                  break;
                case 2:
                case 13:
                  segment(bottom, right);
                  break;
                case 3:
                case 12:
                  segment(left, right);
                  break;
                case 4:
                case 11:
                  segment(top, right);
                  break;
                case 6:
                case 9:
                  segment(top, bottom);
                  break;
                case 7:
                case 8:
                  segment(left, top);
                  break;
                case 5:
                  segment(left, top);
                  segment(bottom, right);
                  break;
                case 10:
                  segment(left, bottom);
                  segment(top, right);
                  break;
              }
            }
        context.stroke();
        context.globalAlpha = 1;
      };
      return loopInView(canvas, draw, () => 24);
    };

    // src/kimi/timeline.ts
    init_engine();
    var ROW_HEIGHT = { side: 217, centre: 462 };
    var TOP_PAD = 169;
    var MARK_RISE = 50;
    var RAIL_SOLID = 98;
    var RAIL_GAP = 4;
    var YEAR_RESTING = 0.4;
    var YEAR_HOLD = 2200;
    var railHeight = () => TOP_PAD + TIMELINE.reduce((t, e) => t + ROW_HEIGHT[e.frame], 0);
    var restingAbs = () => {
      const heights = TIMELINE.map((e) => ROW_HEIGHT[e.frame]);
      const lastTop = TOP_PAD + heights.slice(0, -1).reduce((t, h) => t + h, 0);
      return lastTop + heights[heights.length - 1] / 2 - MARK_RISE;
    };
    var mountTimeline = (root) => {
      const section = root.querySelector("[data-timeline]");
      const cleanups = [];
      const head = new RevealGroup;
      headReveal(section.querySelector(".tl-head"), head);
      cleanups.push(bindInView(section.querySelector(".tl-head"), head, { mode: "forward" }));
      cleanups.push(() => head.dispose());
      const rail = section.querySelector(".tl-rail");
      const svg = rail.querySelector("svg");
      const narrow = window.matchMedia("(max-width: 1023.98px)");
      let rest = 0;
      let mark = 9;
      let progressRect;
      let marker;
      let run = 0;
      const drawRail = () => {
        const origin = narrow.matches ? TOP_PAD : 0;
        const viewH = railHeight() - origin;
        rest = restingAbs() - origin;
        mark = narrow.matches ? 20 : 9;
        rail.style.height = px(viewH);
        svg.setAttribute("viewBox", `0 0 16 ${viewH}`);
        svg.setAttribute("preserveAspectRatio", "none");
        svg.innerHTML = `
      <line x1="8" y1="0" x2="8" y2="${RAIL_SOLID}" stroke="var(--timeline-rail)" stroke-width="1" vector-effect="non-scaling-stroke"/>
      <line x1="8" y1="${RAIL_SOLID + RAIL_GAP}" x2="8" y2="${rest}" stroke="var(--timeline-rail)" stroke-width="1" stroke-dasharray="6 6"/>
      <rect class="rail-run" x="7.5" y="0" width="1" height="0" fill="var(--foreground-on-dark)"/>
      <rect class="rail-mark" x="${-mark / 2}" y="${-mark / 2}" width="${mark}" height="${mark}" fill="var(--foreground-on-dark)"/>`;
        progressRect = svg.querySelector(".rail-run");
        marker = svg.querySelector(".rail-mark");
        paintRail();
      };
      const paintRail = () => {
        if (!progressRect)
          return;
        progressRect.setAttribute("height", `${Math.max(0, run)}`);
        marker.setAttribute("transform", `translate(8 ${run}) rotate(${run / (rest || 1) * 1800})`);
      };
      drawRail();
      narrow.addEventListener("change", drawRail);
      cleanups.push(() => narrow.removeEventListener("change", drawRail));
      cleanups.push(scrub(rail, "top center", "bottom bottom", () => { }, (p) => {
        run = clamp01(p) * rest;
        paintRail();
      }));
      const rows = [...section.querySelectorAll("[data-row]")];
      rows.forEach((row, i) => {
        const entry = TIMELINE[i];
        row.querySelectorAll(".tl-layer").forEach((layer) => {
          const travel = Number(layer.dataset.travel || 0);
          cleanups.push(scrub(row, "top bottom", "bottom top", (p) => {
            layer.style.top = `calc(${px(travel)} * ${1 - 2 * p})`;
          }));
        });
        const slot = row.querySelector(".tl-slot");
        cleanups.push(scrub(row, "top bottom", "top center", (p) => {
          slot.style.top = `${-10 + 10 * p}%`;
        }));
        const group = new RevealGroup;
        const year = row.querySelector("[data-year]");
        letters(year, group, CFG.YEAR, 26, 0);
        const copy = row.querySelector(".tl-copy");
        if (copy)
          group.add(riseSpring(copy, CFG.COPY), 220);
        let settle = null;
        if (entry.frame === "centre") {
          settle = new Spring(CFG.YEAR_SETTLE, 1, (v) => {
            year.style.opacity = `${v}`;
          });
        }
        cleanups.push(bindInView(row, () => {
          group.play();
          settle?.to(YEAR_RESTING, YEAR_HOLD);
        }, { rootMargin: "0% 0% -25% 0%" }));
        cleanups.push(() => {
          group.dispose();
          settle?.dispose();
        });
        const plate = row.querySelector(".tl-plate");
        const hoverable = window.matchMedia("(hover: hover)");
        plate.addEventListener("pointerenter", () => {
          if (!hoverable.matches)
            return;
          row.classList.add("is-hover");
          section.classList.add("is-dim");
        });
        plate.addEventListener("pointerleave", () => {
          row.classList.remove("is-hover");
          section.classList.remove("is-dim");
        });
      });
      return () => cleanups.forEach((c) => c());
    };
    // THE MACHINE
    var mountMachine = (root) => {
      const section = root.querySelector("[data-machine]");
      if (!section) return () => { };

      const cleanups = [];
      const reveal = new RevealGroup();

      const eyebrow = section.querySelector("[data-machine-eyebrow]");
      const title = section.querySelector("[data-machine-title]");
      const description = section.querySelector("[data-machine-description]");
      const car = section.querySelector("[data-machine-car]");
      const info = section.querySelector("[data-machine-info]");

      reveal.add(fadeSpring(eyebrow, CFG.REVEAL), 0);
      reveal.add(riseSpring(title, CFG.REVEAL, "1.5rem"), 120);

      splitText(description, description.textContent.trim(), {
        by: "words",
        stagger: 35,
        cfg: CFG.COPY_FAST,
        delay: 250,
        gap: "0.22em",
        group: reveal
      });

      reveal.add(riseSpring(car, CFG.REVEAL, "2rem"), 450);
      reveal.add(fadeSpring(info, CFG.REVEAL), 650);

      cleanups.push(
        bindInView(section, reveal, {
          mode: "forward",
          rootMargin: "0px 0px -12% 0px"
        })
      );

      cleanups.push(() => reveal.dispose());

      const parts = {
        front: {
          title: "REAR WING",
          text: "The rear wing is a key aerodynamic component. Its movable elements are part of the active aerodynamic system introduced for the 2026 regulations."
        },
        suspension: {
          title: "SUSPENSION",
          text: "The suspension connects the wheels to the chassis. It helps maintain tyre contact with the track and keeps the car stable under braking and cornering."
        },
        cockpit: {
          title: "COCKPIT",
          text: "The cockpit is where Kimi controls the car. It contains the steering wheel, display and essential driver controls."
        },
        sidepod: {
          title: "SIDEPODS",
          text: "The sidepods guide airflow along the car and contain important cooling structures for the power unit and its systems."
        },
        power: {
          title: "POWER UNIT",
          text: "The Mercedes-AMG power unit combines a 1.6-litre V6 turbo engine with an electrical system to deliver performance."
        },
        rear: {
          title: "FRONT WING",
          text: "The front wing is a key aerodynamic component. Its movable elements are part of the active aerodynamic system introduced for the 2026 regulations."
        }
      };

      const infoTitle = section.querySelector("[data-machine-info-title]");
      const infoText = section.querySelector("[data-machine-info-text]");
      const hotspots = [...section.querySelectorAll(".machine-hotspot")];

      const closeInfo = () => {
        info.classList.remove("is-visible");
        hotspots.forEach((button) => {
          button.classList.remove("is-active");
          button.setAttribute("aria-expanded", "false");
        });
      };

      hotspots.forEach((button) => {
        button.addEventListener("click", () => {
          const part = parts[button.dataset.part];

          if (button.classList.contains("is-active")) {
            closeInfo();
            return;
          }

          hotspots.forEach((item) => {
            item.classList.remove("is-active");
            item.setAttribute("aria-expanded", "false");
          });

          button.classList.add("is-active");
          button.setAttribute("aria-expanded", "true");

          infoTitle.textContent = part.title;
          infoText.textContent = part.text;
          info.classList.add("is-visible");
        });

        cleanups.push(() => {
          button.replaceWith(button.cloneNode(true));
        });
      });

      const onEscape = (event) => {
        if (event.key === "Escape") closeInfo();
      };

      section.addEventListener("keydown", onEscape);
      cleanups.push(() => section.removeEventListener("keydown", onEscape));

      return () => cleanups.forEach((cleanup) => cleanup());
    };
    // src/kimi/paddock.ts
    init_engine();
    var mountPaddock = (root) => {
      const section = root.querySelector("[data-paddock]");
      const cleanups = [];
      const layer = section.querySelector(".pd-figure-layer");
      cleanups.push(scrub(section, "top bottom", "bottom top", (p) => {
        layer.style.top = `calc(${px(-48)} * ${p})`;
      }));
      const intro = new RevealGroup;
      headReveal(section.querySelector(".pd-head"), intro);
      const report = section.querySelector(".pd-report");
      splitText(report, report.textContent || "", { by: "words", stagger: 30, cfg: CFG.COPY_FAST, delay: 2 * 130 + 90, gap: "0.22em", group: intro });
      intro.add(riseSpring(section.querySelector(".pd-cta"), CFG.ROW), 2 * 130 + 260);
      cleanups.push(bindInView(section, intro, { mode: "forward", rootMargin: "0px 0px -15% 0px" }));
      const panels = new RevealGroup;
      panels.add(fadeSpring(section.querySelector(".pb-meet"), CFG.REVEAL), 320);
      panels.add(riseSpring(section.querySelector(".pd-meet"), CFG.ROW), 410);
      panels.add(fadeSpring(section.querySelector(".pb-stats"), CFG.REVEAL), 460);
      const rules = [...section.querySelectorAll("[data-rule]")];
      section.querySelectorAll("[data-statrow]").forEach((row, i) => {
        const at = 460 + i * 90;
        const rule = rules[i - 1];
        if (rule)
          panels.add(new Spring(CFG.ROW, 0, (v) => {
            rule.style.transform = `scaleX(${v})`;
          }), at);
        panels.add(riseSpring(row, CFG.ROW, "0.75rem"), at + 40);
        letters(row.querySelector("[data-fig]"), panels, CFG.FIGURE, 24, at + 120);
      });
      cleanups.push(bindInView(section, panels, { mode: "forward", rootMargin: "0px 0px -15% 0px" }));
      const cal = section.querySelector("[data-cal]");
      const strip = new RevealGroup;
      cal.querySelectorAll(".cal-link").forEach((link, i) => {
        strip.add(new Spring(CFG.ROW, 0, (v) => {
          link.style.transform = `scaleX(${v})`;
        }), 560 + i * 90);
      });
      const marks = [...cal.querySelectorAll(".cal-mark")];
      cal.querySelectorAll(".cal-card").forEach((card, i) => {
        strip.add(riseSpring(card, CFG.ROW, "0.5rem"), 560 + i * 90);
        const name = card.querySelector(".cal-name");
        strip.add(new Spring(CFG.NAME, 0, (v) => {
          name.style.opacity = `${clamp01(v)}`;
          name.style.transform = `translateY(${(1 - v) * 0.3}em)`;
        }), 560 + i * 90 + 110);
        strip.add(fadeSpring(marks[i], CFG.ROW), 560 + i * 90 + 60);
      });
      strip.add(fadeSpring(cal.querySelector(".cal-bracket"), CFG.REVEAL), 560 + 5 * 90);
      cleanups.push(bindInView(cal, strip, { mode: "forward", rootMargin: "0% 0% -20% 0%" }));
      cleanups.push(() => {
        intro.dispose();
        panels.dispose();
        strip.dispose();
      });
      const live = cal.querySelector(".cal-live");
      live.addEventListener("pointerenter", () => cal.classList.add("is-live-hover"));
      live.addEventListener("pointerleave", () => cal.classList.remove("is-live-hover"));
      const links = [...cal.querySelectorAll(".cal-link")];
      const pulse = cal.querySelector(".cal-pulse");
      const t0 = performance.now();
      cleanups.push(loopInView(cal, () => {
        const now = performance.now() - t0;
        const crawl = now % 5200 / 5200;
        for (const link of links) {
          const dir = Number(link.dataset.dir);
          link.style.backgroundPositionX = `calc(${px(11.45)} * ${crawl * dir})`;
        }
        const v = easeOutQuad(now % 3200 / 3200);
        pulse.setAttribute("r", `${5.5 + v * 5.5 * 3.4}`);
        pulse.setAttribute("opacity", `${0.5 * (1 - v) * (1 - v)}`);
      }, () => 0));
      return () => cleanups.forEach((c) => c());
    };

    // src/kimi/footer.ts
    init_engine();
    var mountFooter = (root) => {
      const section = root.querySelector("[data-footer]");
      const cleanups = [];
      const backToTop = root.querySelector("[data-back-top]");
      const onScroll = () => {
        backToTop?.classList.toggle("is-visible", window.scrollY > Math.max(500, window.innerHeight * 0.75));
      };
      onScroll();
      window.addEventListener("scroll", onScroll, { passive: true });
      cleanups.push(() => window.removeEventListener("scroll", onScroll));
      const layer = section.querySelector(".ft-figure-layer");
      cleanups.push(scrub(section, "top bottom", "bottom bottom", (p) => {
        layer.style.top = `calc(${px(60)} * ${1 - p})`;
      }));
      const group = new RevealGroup;
      group.add(fadeSpring(section.querySelector(".ft-logo"), CFG.REVEAL), 120);
      headReveal(section.querySelector(".ft-head"), group);
      section.querySelectorAll("[data-navtext]").forEach((el, i) => letters(el, group, CFG.ROW, 22, 260 + i * 80, "0.2em"));
      section.querySelectorAll("[data-foot]").forEach((el, i) => group.add(riseSpring(el, CFG.REVEAL), 640 + i * 80));
      cleanups.push(bindInView(section, group, { mode: "forward", rootMargin: "0px 0px -10% 0px" }));
      cleanups.push(() => group.dispose());
      return () => cleanups.forEach((c) => c());
    };

    // src/kimi/page.ts
    var RECEDE_SCALE = 0.9;
    var RECEDE_SHADE = 0.55;
    var mountStack = (root) => {
      const layers = [...root.querySelectorAll(".stack-layer")];
      const pinned = layers.filter((l) => l.classList.contains("stack-pin")).map((layer) => ({
        inner: layer.querySelector(".stack-inner"),
        shade: layer.querySelector(".stack-shade"),
        next: layers[layers.indexOf(layer) + 1]
      }));
      const phone = window.matchMedia("(max-width: 639px)");
      const apply = () => {
        const view = window.innerHeight || 1;
        const shrink = phone.matches ? 0 : 1 - RECEDE_SCALE;
        for (const { inner, shade, next } of pinned) {
          const p = Math.min(1, Math.max(0, 1 - next.getBoundingClientRect().top / view));
          inner.style.transform = p > 0 && shrink > 0 ? `scale(${1 - shrink * p})` : "";
          inner.style.willChange = p > 0 && shrink > 0 ? "transform" : "";
          shade.style.opacity = `${RECEDE_SHADE * p}`;
          inner.style.visibility = p >= 1 ? "hidden" : "visible";
        }
      };
      let frame = 0;
      const onScroll = () => {
        if (frame)
          return;
        frame = requestAnimationFrame(() => {
          frame = 0;
          apply();
        });
      };
      window.addEventListener("scroll", onScroll, { passive: true });
      window.addEventListener("resize", onScroll);
      apply();
      return () => {
        window.removeEventListener("scroll", onScroll);
        window.removeEventListener("resize", onScroll);
        if (frame)
          cancelAnimationFrame(frame);
      };
    };
    var mount = (host) => {
      if ("scrollRestoration" in history)
        history.scrollRestoration = "manual";
      window.scrollTo(0, 0);
      document.body.classList.add("k-body");
      const cleanups = [];
      const onWide = () => {
        document.documentElement.style.fontSize = window.innerWidth > 1920 ? `${16 * window.innerWidth / 1920}px` : "";
      };
      onWide();
      window.addEventListener("resize", onWide);
      cleanups.push(() => {
        window.removeEventListener("resize", onWide);
        document.documentElement.style.fontSize = "";
      });
      let lenis = null;
      if (!reducedMotion()) {
        lenis = new Lenis({ smoothWheel: true });
        const l = lenis;
        cleanups.push(subscribe((time) => l.raf(time), () => 0));
        cleanups.push(() => l.destroy());
      }
      host.innerHTML = pageMarkup();
      const root = host.querySelector(".kimi");
      root.querySelectorAll("img").forEach((img) => {
        img.addEventListener("error", () => {
          Promise.resolve().then(() => (init_engine(), {})).then(({ }) => reportFailure(img.currentSrc || img.src));
        }, { once: true });
      });
      cleanups.push(mountStack(root));
      cleanups.push(mountHero(root, lenis));
      cleanups.push(mountSeason(root));
      cleanups.push(mountTimeline(root));
      cleanups.push(mountMachine(root));
      cleanups.push(mountPaddock(root));
      cleanups.push(mountFooter(root));
      root.querySelectorAll("canvas.chequer").forEach((c) => cleanups.push(mountChequer(c)));
      root.querySelectorAll("canvas.contours").forEach((c) => cleanups.push(mountContours(c)));
      return () => {
        cleanups.reverse().forEach((c) => {
          try {
            c();
          } catch (e) {
            console.error(e);
          }
        });
        host.innerHTML = "";
        document.body.classList.remove("k-body");
      };
    };

    // src/kimi/standalone.ts
    mount(document.getElementById("app"));

  </script>
</body>
